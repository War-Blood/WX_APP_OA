version: '3.8'

services:
  # ==============================
  # MySQL 8.0 数据库
  # ==============================
  mysql:
    image: mysql:8.0
    container_name: oa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-OA@Root2024}
      MYSQL_USER: ${OA_DB_USER:-daily_report_user}
      MYSQL_PASSWORD: ${OA_DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${OA_DB_NAME:-wx_app_oa}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/migration_v1_rbac.sql:/docker-entrypoint-initdb.d/01-rbac.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================
  # Redis 缓存
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: oa-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==============================
  # 后端 API 服务
  # ==============================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: oa-backend
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      PORT: "3100"
      OA_DB_HOST: mysql
      OA_DB_PORT: "3306"
      OA_DB_USER: ${OA_DB_USER:-daily_report_user}
      OA_DB_PASSWORD: ${OA_DB_PASSWORD:?err}
      OA_DB_NAME: ${OA_DB_NAME:-wx_app_oa}
      OA_DB_POOL_MAX: "20"
      OLD_DB_HOST: mysql
      OLD_DB_PORT: "3306"
      OLD_DB_USER: ${OLD_DB_USER:-daily_report_user}
      OLD_DB_PASSWORD: ${OLD_DB_PASSWORD:-changeme}
      OLD_DB_NAME: ${OLD_DB_NAME:-daily_report}
      OLD_DB_POOL_MAX: "10"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?err}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WX_APPID: ${WX_APPID:-wx56609483f0ee55b6}
      WX_SECRET: ${WX_SECRET:?err}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-false}"
      WPS_API_KEY: ${WPS_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/api/health', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==============================
  # Nginx (Web 管理后台 + API 代理)
  # ==============================
  nginx:
    image: nginx:alpine
    container_name: oa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webapp/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
