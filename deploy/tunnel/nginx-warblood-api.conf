# 云服务器 /etc/nginx/sites-enabled/daily-report-api 的 /api/ 与 /api-docs 段
# 切换动作只有一处：127.0.0.1:3000 → 127.0.0.1:13000（frps 的 loopback 端口）
# 其余（证书、静态站点、/scm 跳转）保持不变

location /api/ {
    proxy_pass http://127.0.0.1:13000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api-docs {
    proxy_pass http://127.0.0.1:13000/api-docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
